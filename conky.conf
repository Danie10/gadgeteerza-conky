conky.config = {
	alignment = 'top_left',
	background = false,
	border_width = 1,
	cpu_avg_samples = 2,
	default_color = 'white',
	default_outline_color = 'white',
	default_shade_color = 'white',
	double_buffer = true,
	draw_borders = false,
	draw_graph_borders = true,
	draw_outline = false,
	draw_shades = false,
	extra_newline = false,
	font = 'DejaVu Sans Mono:size=12',
	gap_x = 40,
	gap_y = 60,
	-- No xinerama_head was set before, so gap_x/gap_y were relative to the
	-- WHOLE virtual screen (all 3 monitors combined) - this broke when DP-2
	-- rotated to portrait and changed the virtual screen's dimensions.
	-- Pinning to monitor 3 (HDMI-A-2) instead. Head index confirmed via
	-- `xrandr --listactivemonitors`: 0=DP-1, 1=HDMI-A-2, 2=DP-2.
	-- If reverting DP-2 to landscape and this breaks again, just comment
	-- the line below back out:
	xinerama_head = 1,
	minimum_height = 5,
	minimum_width = 5,
	net_avg_samples = 2,
	no_buffers = true,
	out_to_console = false,
	out_to_ncurses = false,
	out_to_stderr = false,
	out_to_x = true,
	own_window = true,
	own_window_class = 'Conky',
	own_window_type = 'normal',
	-- MIGRATED to the modern single-setting form. The four lines below were
	-- replaced because conky 1.22 deprecated or removed all of them:
	--   own_window_transparent  - deprecated, superseded by the alpha channel
	--   own_window_argb_visual  - REMOVED; ARGB is now always on when available
	--   own_window_argb_value   - deprecated, superseded by the alpha channel
	--   own_window_bg_color     - never a real conky setting; it was silently
	--                             ignored, so the '#68000000' here did nothing
	-- Old lines, kept for reference in case of a rollback:
	-- own_window_transparent = false,
	-- own_window_argb_visual = true,
	-- own_window_argb_value = 130,
	-- own_window_bg_color = '#68000000',
	--
	-- own_window_colour takes #AARRGGBB - ALPHA FIRST, then the colour
	-- (per `man conky`: '#0000' is fully transparent, '#f000' opaque black).
	-- The old argb_value of 130 = 0x82, over black, so 130 -> '#82000000'.
	-- This preserves the exact previous opacity (~51%).
	own_window_colour = '#82000000',
	-- Forces the window manager to render the layer cleanly
	own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
	show_graph_range = false,
	show_graph_scale = false,
	stippled_borders = 0,
	update_interval = 10.0,
	uppercase = false,
	use_spacer = 'none',
	use_xft = true,

	-- Path to your Lua script for audio alerts
	lua_load = '/home/danie/scripts/temp_alerts.lua',
}

conky.text = [[
${font Good Times:size=12}${color Tan1}INFO ${font}$color ${scroll 32 $sysname $kernel $machine}
$hr
${color grey}Uptime:$alignr $color $uptime
${color grey}Window Manager: $alignr $color $XDG_SESSION_TYPE
${color grey}RAM Usage:$color $mem/$memmax - $memperc% ${membar 4}
${color grey}Swap Usage:$color $swap/$swapmax - $swapperc% ${swapbar 4}
${color grey}Zram Usage: $color $alignr ${execi 60 zramctl --raw --noheadings --output TOTAL,DISKSIZE | awk '{print $1 " / " $2}'}
$hr
# CPU model is static for the life of the machine. The old execi ran a 4-process
# pipeline (cat|grep|sed|uniq) every 1000s; 86400 makes it effectively once a day.
${font Good Times:size=12}${color Tan1}CPU ${font}$color $alignr${execi 86400 awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo}
# CPU Temp + Fan1/Fan2/Fan3 - ONE sensors call (via sensor_stats.sh) feeds all four values
# Run as an external script to avoid conky's text_buffer_size truncating a long inline execi command
${execi 10 /home/danie/scripts/sensor_stats.sh}${color grey}Temperature: \
${if_match ${cat /tmp/cpu_temp} >= 80}${color red}\
${else}${color green}${endif}\
$alignr${cat /tmp/cpu_temp}°C${lua check_alert CPU /tmp/cpu_temp}
${color grey}Usage:$color $cpu% ${cpubar 4}
${color grey}Fan: $color $alignr ${cat /tmp/fan1_rpm} RPM
$hr
# ---------------------------------------------------
# GPU Stats
# ---------------------------------------------------
# Runs the gpu_stats.sh script every 10 seconds to get all metrics once
${execpi 10 /home/danie/scripts/gpu_stats.sh}
# The script outputs actual conky output, and execpi takes that text output and feeds it into it's own engine seamlessly.
# Conky parses those newly received tags and renders them on the screen as formatted text, bars, and colors.
# This remains separate as it's static hardware info
# The GPU slowdown threshold is a fixed hardware property of the card - it does
# not change at runtime, so re-querying it cost a full 'nvidia-smi -q' (the slow
# verbose query, ~55ms) plus a grep and awk every hour for a value that is
# always 95. Verified with: nvidia-smi -q -d temperature | grep Slowdown
${color grey}Throttle at:$color $alignr 95°C
$hr
# Chassis fans
${font Good Times:size=12}${color Tan1}CHASSIS FANS ${font}
# Values read from the shared /tmp/sensors_cache written above - no separate sensors calls needed here anymore
${color grey}Front Fan:$color $alignr ${cat /tmp/fan2_rpm} RPM
${color grey}Rear Fan: $color $alignr ${cat /tmp/fan3_rpm} RPM
$hr
# ---------------------------------
# DRIVE TEMPS
# ---------------------------------
${font Good Times:size=12}${color Tan1}DRIVE TEMPS ${font}
# All three drive temps now come from /tmp cache files written by sensor_stats.sh,
# which reads them from the kernel's hwmon sysfs (drivetemp + nvme modules).
# This replaced two 'sudo smartctl' execi calls that needed root, forked 4
# processes each, and could spin up an idle disk just to read its temperature.
#
# BUG FIX: the NVMe line previously read ${hwmon 1 temp 1}, but hwmon1 is a
# 'drivetemp' node (currently /dev/sda), NOT the NVMe - so this was showing a
# hard drive's temperature labelled as NVMe, and applying the 70C NVMe
# threshold to a drive that should alert at 60C. hwmon indices also aren't
# stable across reboots, so sensor_stats.sh now resolves them by device name.
${color grey}NVMe: ${if_match ${cat /tmp/nvme_temp} >= 70}${color red}${else}${color green}${endif}$alignr${cat /tmp/nvme_temp}°C ${lua check_alert NVMe /tmp/nvme_temp}
# HDD SDA (Home)
${color grey}Home ${if_match ${cat /tmp/sda_temp} >= 60}${color red}${else}${color green}${endif}$alignr${cat /tmp/sda_temp}°C ${lua check_alert Drive_SDA /tmp/sda_temp}
# HDD SDC (Backup)
${color grey}Backup ${if_match ${cat /tmp/sdc_temp} >= 60}${color red}${else}${color green}${endif}$alignr${cat /tmp/sdc_temp}°C ${lua check_alert Drive_SDC /tmp/sdc_temp}
${color grey}$hr
# ---------------------------------
# FILE SYSTEMS SPACE
# ---------------------------------
${font Good Times:size=12}${color Tan1}FILE SYSTEMS FREE SPACE ${font}
# Root partition alert (Warning at 90% usage)
${color grey}Linux Boot \
${if_match ${fs_used_perc /} >= 90}${color red}${else}${color grey}${endif}\
${fs_free /} of ${fs_size /} ${fs_bar 6 /} \
${lua check_alert Root_Full /tmp/root_usage}
# BUG FIX: the line that used to sit above the alert was
#   ${execi 600 echo ${fs_used_perc /} > /tmp/root_usage}
# Conky does NOT expand its own variables inside an execi command string - it
# passed the literal text "${fs_used_perc /}" to the shell, which failed with
# "bad substitution". /tmp/root_usage was therefore never created, so this
# "storage almost full" voice alert had never fired since it was written.
# sensor_stats.sh now writes /tmp/root_usage via df, so the alert works.
# OLD ${color grey}Linux Boot $color${fs_free /} of ${fs_size /} ${fs_bar 6 /}
${color grey}Home $color${fs_free /home} of ${fs_size /home} ${fs_bar 6 /home}
${color grey}Backup $color${fs_free /mnt/LinuxBackup} of ${fs_size /mnt/LinuxBackup} ${fs_bar 6 /mnt/LinuxBackup}
$hr
${font Good Times:size=12}${color Tan1}NETWORKING ${font}
${if_existing /sys/class/net/enp5s0/operstate up}\
${color #0077ff}Net Down:$color ${downspeedf enp5s0} $alignr${color #0077ff}Net Up:$color ${upspeedf enp5s0}
${color #0077ff}${downspeedgraph enp5s0 32,155 104E8B 0077ff} $alignr${color #0077ff}${upspeedgraph enp5s0 32,155 104E8B 0077ff}\
${endif}$color
$hr
${font Good Times:size=12}${color Tan1}TOP PROCESSES ${font}
${color grey} Name PID CPU% MEM%
${color lightgrey} ${top name 1} ${top pid 1} ${top cpu 1} ${top mem 1}
${color lightgrey} ${top name 2} ${top pid 2} ${top cpu 2} ${top mem 2}
${color lightgrey} ${top name 3} ${top pid 3} ${top cpu 3} ${top mem 3}
${color lightgrey} ${top name 4} ${top pid 4} ${top cpu 4} ${top mem 4}
]]
